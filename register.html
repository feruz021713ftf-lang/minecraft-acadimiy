<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Minecraft Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="auth-page">
  <main class="auth-wrap">
    <div class="auth-card">
      <a class="logo" href="index.html">
        <span class="logo-block" aria-hidden="true"></span>
        <span class="logo-text">Minecraft <em>Academy</em></span>
      </a>
      <h1>Create demo account</h1>
      <p class="muted">Local-only demo. No real passwords. Choose a display name and a 4-digit PIN.</p>

      <form id="register-form" class="form" novalidate>
        <div class="field">
          <label for="reg-name">Display name</label>
          <input id="reg-name" name="name" type="text" autocomplete="username" required minlength="3" maxlength="20" placeholder="e.g. SteveBuilder" />
          <p class="field-error" data-error-for="reg-name"></p>
        </div>
        <div class="field">
          <label for="reg-pin">Demo PIN (4 digits)</label>
          <input id="reg-pin" name="pin" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4" required placeholder="1234" />
          <p class="field-error" data-error-for="reg-pin"></p>
        </div>
        <div class="field">
          <label for="reg-pin2">Confirm PIN</label>
          <input id="reg-pin2" name="pin2" type="text" inputmode="numeric" pattern="\d{4}" maxlength="4" required placeholder="1234" />
          <p class="field-error" data-error-for="reg-pin2"></p>
        </div>
        <label class="check">
          <input type="checkbox" id="reg-ack" required />
          <span>I understand this is a demo and I will not enter a real password.</span>
        </label>
        <p class="field-error" data-error-for="reg-ack"></p>
        <div class="form-status" role="status" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>

      <div class="auth-links">
        <a href="login.html">Already have an account? Log in</a>
      </div>
      <a class="back-link" href="index.html">← Back to home</a>
    </div>
  </main>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
