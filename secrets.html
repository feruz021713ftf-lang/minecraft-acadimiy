<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secrets &amp; Survival — Minecraft Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
      <a class="logo" href="index.html">
        <span class="logo-block" aria-hidden="true"></span>
        <span class="logo-text">Minecraft <em>Academy</em></span>
      </a>
      <nav class="side-nav">
        <a class="side-link" href="dashboard.html">Dashboard</a>
        <a class="side-link" href="controls.html">Controls &amp; Inventory</a>
        <a class="side-link" href="movement-combat.html">Movement &amp; Combat</a>
        <a class="side-link" href="crafting.html">Crafting &amp; Enchanting</a>
        <a class="side-link active" href="secrets.html">Secrets &amp; Survival</a>
        <hr />
        <a class="side-link" href="achievements.html">Achievements</a>
        <a class="side-link" href="leaderboard.html">Leaderboard</a>
        <a class="side-link" href="profile.html">Profile</a>
        <a class="side-link" href="settings.html">Settings</a>
      </nav>
      <button class="btn btn-ghost btn-block" id="logout-btn">Log out</button>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <button class="nav-toggle" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false">
          <span class="sr-only">Toggle sidebar</span><span class="hamburger" aria-hidden="true"></span>
        </button>
        <h1 class="app-title">Secrets &amp; Survival</h1>
        <div class="topbar-user"><span class="avatar small" aria-hidden="true"></span><span id="topbar-name">DemoPlayer</span></div>
      </header>

      <main class="app-content">
        <section class="panel">
          <h2 class="panel-title">Knowledge hub</h2>
          <div class="filters">
            <input type="search" id="guide-search" placeholder="Search guides…" aria-label="Search guides" />
            <select id="guide-category" aria-label="Filter by category">
              <option value="all">All categories</option>
              <option value="mobs">Mobs</option>
              <option value="farming">Farming</option>
              <option value="trading">Villager Trading</option>
              <option value="redstone">Redstone</option>
              <option value="nether">Nether</option>
              <option value="stronghold">Stronghold</option>
              <option value="end">End</option>
              <option value="structures">Structures</option>
              <option value="survival">Survival</option>
            </select>
          </div>
          <div class="guide-grid" id="guide-grid"></div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Additional lessons</h2>
          <div class="card-grid" id="extra-secrets-lessons"></div>
        </section>

        <section class="panel">
          <h2 class="panel-title">Knowledge quiz</h2>
          <div id="quiz-secrets"></div>
        </section>

        <div class="module-nav">
          <a class="btn btn-outline" href="crafting.html">← Crafting</a>
          <a class="btn btn-primary" href="dashboard.html">Back to Dashboard →</a>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/secrets.js"></script>
</body>
</html>
