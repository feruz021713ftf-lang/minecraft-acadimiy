<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Minecraft Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation">
      <a class="logo" href="index.html">
        <span class="logo-block" aria-hidden="true"></span>
        <span class="logo-text">Minecraft <em>Academy</em></span>
      </a>
      <nav class="side-nav">
        <a class="side-link" href="dashboard.html">Dashboard</a>
        <a class="side-link" href="controls.html">Controls &amp; Inventory</a>
        <a class="side-link" href="movement-combat.html">Movement &amp; Combat</a>
        <a class="side-link" href="crafting.html">Crafting &amp; Enchanting</a>
        <a class="side-link" href="secrets.html">Secrets &amp; Survival</a>
        <hr />
        <a class="side-link" href="achievements.html">Achievements</a>
        <a class="side-link" href="leaderboard.html">Leaderboard</a>
        <a class="side-link active" href="profile.html">Profile</a>
        <a class="side-link" href="settings.html">Settings</a>
      </nav>
      <button class="btn btn-ghost btn-block" id="logout-btn">Log out</button>
    </aside>
    <div class="app-main">
      <header class="app-topbar">
        <button class="nav-toggle" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="false">
          <span class="sr-only">Toggle sidebar</span><span class="hamburger" aria-hidden="true"></span>
        </button>
        <h1 class="app-title">Profile</h1>
        <div class="topbar-user"><span class="avatar small" aria-hidden="true"></span><span id="topbar-name">DemoPlayer</span></div>
      </header>

      <main class="app-content">
        <section class="panel">
          <h2 class="panel-title">Account</h2>
          <form id="profile-form" class="form">
            <div class="field">
              <label for="profile-name">Display name</label>
              <input id="profile-name" type="text" minlength="3" maxlength="20" required />
              <p class="field-error" data-error-for="profile-name"></p>
            </div>
            <div class="field">
              <label for="profile-avatar">Avatar</label>
              <select id="profile-avatar">
                <option value="default">Default</option>
                <option value="steve">Steve-inspired</option>
                <option value="alex">Alex-inspired</option>
                <option value="creeper">Creeper-inspired</option>
              </select>
            </div>
            <div class="form-status" role="status" aria-live="polite"></div>
            <button class="btn btn-primary" type="submit">Save profile</button>
          </form>
        </section>

        <section class="panel">
          <h2 class="panel-title">Progress summary</h2>
          <ul class="stat-list" id="profile-stats"></ul>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="js/i18n.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module">
    import { requireSession } from './js/auth.js';
    import { getProgress, getRankForXP } from './js/progress.js';
    import { saveSession } from './js/auth.js';
    const session = requireSession();
    if (session) {

    const nameInput = document.getElementById('profile-name');
    const avatarInput = document.getElementById('profile-avatar');
    nameInput.value = session.name || 'DemoPlayer';
    avatarInput.value = session.avatar || 'default';

    document.getElementById('profile-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const status = e.target.querySelector('.form-status');
      const name = nameInput.value.trim();
      if (name.length < 3) {
        status.textContent = 'Name must be at least 3 characters.';
        status.className = 'form-status error';
        return;
      }
      session.name = name;
      session.avatar = avatarInput.value;
      saveSession(session);
      status.textContent = 'Profile saved.';
      status.className = 'form-status success';
      document.getElementById('topbar-name').textContent = name;
    });

    const p = getProgress();
    const rank = getRankForXP(p.xp);
    document.getElementById('profile-stats').innerHTML = `
      <li><span>XP</span><strong>${p.xp}</strong></li>
      <li><span>Rank</span><strong>${rank.name}</strong></li>
      <li><span>Lessons completed</span><strong>${p.lessons.length}</strong></li>
      <li><span>Achievements unlocked</span><strong>${p.achievements.length}</strong></li>
    `;
    }
  </script>
</body>
</html>
